<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Határidők</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        *{
            color: white;
        }
        body{
            background-image: url('back.jpg');
            margin: 0;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh;
            background-position: center center;
            background-attachment: fixed;
        }
        .blur{
            backdrop-filter: blur(10px);
        }
        .sarga{
            background-color: rgba(255, 255, 0, 0.155);
        }
        .piros{
            background-color: rgba(255, 0, 0, 0.155);
        }
        .zold{
            background-color: rgba(34, 255, 0, 0.155);
        }
    </style>
</head>
<body class="container mt-5">
    <div class="display-1 text-center fw-bold">Határidők</div>
    <div id="tarolo" class="mt-4 row row-cols-1 row-cols-xl-2 row-cols-xxl-3 gx-4 gy-4">
        <div class="col">
            <div class="h-100 rounded shadow p-4 blur zold">
                <div class="fw-bold fs-2 text-center">Tavaszi szünet</div>
                <div class="row row-cols-4">
                    <div class="col text-center">
                        <div class="fw-bold display-5">0</div>
                        <div>nap</div>
                    </div>
                    <div class="col text-center">
                        <div class="display-5">0</div>
                        <div>óra</div>
                    </div>
                    <div class="col text-center">
                        <div class="display-5">0</div>
                        <div>perc</div>
                    </div>
                    <div class="col text-center">
                        <div class="display-5">0</div>
                        <div>mp</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
